<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23272822'/%3E%3Cpath d='M10 10l-4 6 4 6M22 10l4 6-4 6M18 8l-4 16' stroke='%23A6E22E' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroCode Study :: Entrevistas Técnicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Monaco Editor workers via CDN (evita configuração Vite trabalhosa)
      self.MonacoEnvironment = {
        getWorkerUrl: function (workerId, label) {
          const base = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs';
          switch (label) {
            case 'json':
              return `${base}/language/json/json.worker.js`;
            case 'css':
            case 'scss':
            case 'less':
              return `${base}/language/css/css.worker.js`;
            case 'html':
            case 'handlebars':
            case 'razor':
              return `${base}/language/html/html.worker.js`;
            case 'typescript':
            case 'javascript':
              return `${base}/language/typescript/ts.worker.js`;
            default:
              return `${base}/editor/editor.worker.js`;
          }
        },
      };
    </script>
  </head>
  <body class="bg-retro-bg text-retro-text font-mono antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
